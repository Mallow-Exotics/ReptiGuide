<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReptiGuide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1511;
    --surface: #15201a;
    --line: #26372d;
    --text: #e8efe9;
    --muted: #93a79a;
    --accent: #b8e04a;
    --danger: #ff8a7a;
    --display: "Fraunces", Georgia, serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 64px;
    padding: 0 clamp(20px, 5vw, 48px);
    background: rgba(13, 21, 17, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }

  .topbar-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.01em;
    color: var(--text);
    text-decoration: none;
  }

  .back {
    display: none;
    align-items: center;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    transition: color .2s, border-color .2s;
  }
  .back:hover { color: var(--accent); border-color: var(--accent); }
  body.on-species .back { display: inline-flex; }

  /* ---------- Account area (top right) ---------- */
  [hidden] { display: none !important; }

  .auth-area {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .auth-area.pending { visibility: hidden; }

  .pill-btn {
    font-family: var(--body);
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
  }
  .pill-btn:hover { color: var(--accent); border-color: var(--accent); }
  .pill-btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1511; }
  .pill-btn.primary:hover { background: #cdf060; color: #0d1511; }
  .pill-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
  .pill-btn:disabled { opacity: .6; cursor: default; }

  .profile-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 4px 14px 4px 4px;
    font-family: var(--body);
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .profile-btn:hover { color: var(--accent); border-color: var(--accent); }
  .profile-btn .name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 480px) {
    .profile-btn { padding: 4px; }
    .profile-btn .name { display: none; }
  }

  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--accent);
    color: #0d1511;
    font-family: var(--display);
    font-weight: 700;
    font-size: 1rem;
  }
  .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .avatar.large { width: 84px; height: 84px; font-size: 2.2rem; }

  /* ---------- Popups ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(5, 9, 7, 0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    position: relative;
    width: 100%;
    max-width: 400px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    padding: 32px 28px 28px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
  }
  .modal-close:hover { color: var(--text); }

  .modal h2 {
    font-family: var(--display);
    font-size: 1.7rem;
    margin-bottom: 20px;
  }
  .modal-sub { margin: -8px 0 18px; font-size: 0.92rem; color: var(--muted); }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    margin-bottom: 20px;
    background: var(--bg);
    border-radius: 10px;
  }
  .tabs button {
    flex: 1;
    padding: 8px;
    font-family: var(--body);
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
    background: transparent;
    border: none;
    border-radius: 7px;
    cursor: pointer;
  }
  .tabs button.active { background: var(--line); color: var(--text); }

  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 11px;
    font-family: var(--body);
    font-size: 0.95rem;
    font-weight: 500;
    color: #1f1f1f;
    background: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .google-btn:hover { background: #f1f1f1; }
  .google-btn svg { width: 18px; height: 18px; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .modal label {
    display: block;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .modal input[type="text"], .modal input[type="password"], .modal input[type="email"] {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 11px 12px;
    font-family: var(--body);
    font-size: 1rem;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .modal input:focus { outline: none; border-color: var(--accent); }

  .modal .submit { width: 100%; padding: 11px; margin-top: 4px; }

  .form-msg { min-height: 1.3em; margin-top: 14px; font-size: 0.88rem; color: var(--danger); }
  .form-msg.ok { color: var(--accent); }

  .link-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 6px;
    font-family: var(--body);
    font-size: 0.88rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
  }
  .link-btn:hover { color: var(--text); }

  .settings-avatar { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
  .avatar-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .settings-line { height: 1px; margin: 22px 0; background: var(--line); }

  /* ---------- Home ---------- */
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(48px, 10vh, 96px) clamp(20px, 5vw, 32px) 80px;
  }

  .hero { margin-bottom: clamp(40px, 7vh, 64px); }

  .hero h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(3rem, 9vw, 5.5rem);
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    animation: rise .8s ease both;
  }

  .hero p {
    max-width: 34ch;
    font-size: clamp(1.05rem, 2.4vw, 1.25rem);
    color: var(--muted);
    animation: rise .8s .12s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Species buttons ---------- */
  .species-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    list-style: none;
  }

  .species-btn {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 120px;
    padding: 0 28px;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface);
    color: var(--text);
    text-decoration: none;
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    isolation: isolate;
    transition: border-color .25s, transform .25s;
  }

  /* The reptile photo, fading from right (visible) to left (hidden) */
  .species-btn .photo {
    position: absolute;
    inset: 0;
    z-index: -2;
    background-size: cover;
    background-position: center;
    -webkit-mask-image: linear-gradient(to right, transparent 15%, rgba(0,0,0,.95) 100%);
            mask-image: linear-gradient(to right, transparent 15%, rgba(0,0,0,.95) 100%);
    opacity: .75;
    transform: scale(1.04);
    transition: transform .6s ease, opacity .3s;
  }

  .species-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(to right, var(--surface) 25%, transparent 85%);
  }

  .species-btn:hover,
  .species-btn:focus-visible {
    border-color: var(--accent);
    transform: translateX(4px);
    outline: none;
  }
  .species-btn:hover .photo,
  .species-btn:focus-visible .photo { transform: scale(1.1); opacity: 1; }

  .species-btn:focus-visible { box-shadow: 0 0 0 3px rgba(184, 224, 74, .35); }

  /* ---------- Species page ---------- */
  .species-page { min-height: calc(100vh - 64px); }

  .guide-section {
    padding: clamp(32px, 6vh, 56px) 0;
    border-top: 1px solid var(--line);
  }
  .guide-section:first-child { border-top: none; }

  .guide-section h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.6rem, 4.5vw, 2.2rem);
    letter-spacing: -0.01em;
    margin-bottom: 16px;
    color: var(--accent);
  }

  .guide-section p {
    max-width: 62ch;
    font-size: 1.05rem;
    color: var(--text);
  }
  .guide-section p + p { margin-top: 1em; }

  /* ---------- View switching ---------- */
  #home, #species { display: none; }
  body.on-home #home { display: block; }
  body.on-species #species { display: block; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="on-home">

  <header class="topbar">
    <a class="back" href="#/" aria-label="Back to home">&larr; Back</a>
    <a class="topbar-title" id="topbar-title" href="#/">ReptiGuide</a>

    <div class="auth-area pending" id="auth-area"></div>
  </header>

  <!-- LOG IN / CREATE ACCOUNT POPUP -->
  <div class="modal-overlay" id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-heading">
    <div class="modal">
      <button class="modal-close" id="close-auth" type="button" aria-label="Close">&times;</button>
      <h2 id="auth-heading">Welcome back</h2>

      <div class="tabs">
        <button type="button" id="tab-login" class="active">Log in</button>
        <button type="button" id="tab-signup">Create account</button>
      </div>

      <button class="google-btn" id="google-btn" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Continue with Google
      </button>

      <div class="divider" id="auth-divider">or use your username</div>

      <form id="login-form" novalidate>
        <label>Username
          <input id="login-username" type="text" autocomplete="username" maxlength="20">
        </label>
        <label>Password
          <input id="login-password" type="password" autocomplete="current-password">
        </label>
        <button class="pill-btn primary submit" id="login-submit" type="submit">Log in</button>
      </form>

      <form id="signup-form" novalidate hidden>
        <label>Email
          <input id="signup-email" type="email" autocomplete="email">
        </label>
        <button class="pill-btn primary submit" id="signup-submit" type="submit">Send verification link</button>
      </form>

      <p class="form-msg" id="auth-msg" role="alert"></p>
    </div>
  </div>

  <!-- CREATE USERNAME + PASSWORD POPUP (shown after Google / email verification) -->
  <div class="modal-overlay" id="setup-modal" role="dialog" aria-modal="true" aria-labelledby="setup-heading">
    <div class="modal">
      <h2 id="setup-heading">Create your profile</h2>
      <p class="modal-sub" id="setup-sub">Choose a username and password for ReptiGuide.</p>

      <form id="setup-form" novalidate>
        <label>Username
          <input id="setup-username" type="text" autocomplete="username" maxlength="20">
        </label>
        <label>Password
          <input id="setup-password" type="password" autocomplete="new-password">
        </label>
        <label>Confirm password
          <input id="setup-password2" type="password" autocomplete="new-password">
        </label>
        <button class="pill-btn primary submit" id="setup-submit" type="submit">Create account</button>
      </form>

      <button class="link-btn" id="setup-cancel" type="button">Cancel and sign out</button>
      <p class="form-msg" id="setup-msg" role="alert"></p>
    </div>
  </div>

  <!-- SETTINGS POPUP -->
  <div class="modal-overlay" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-heading">
    <div class="modal">
      <button class="modal-close" id="close-settings" type="button" aria-label="Close">&times;</button>
      <h2 id="settings-heading">Settings</h2>

      <div class="settings-avatar">
        <div id="settings-avatar"></div>
        <div class="avatar-actions">
          <button class="pill-btn" id="change-photo" type="button">Change picture</button>
          <button class="pill-btn" id="remove-photo" type="button">Remove</button>
        </div>
        <input type="file" id="photo-input" accept="image/*" hidden>
      </div>

      <form id="username-form" novalidate>
        <label>Username
          <input id="settings-username" type="text" autocomplete="off" maxlength="20">
        </label>
        <button class="pill-btn primary submit" id="username-save" type="submit">Save username</button>
      </form>

      <p class="form-msg" id="settings-msg" role="alert"></p>

      <div class="settings-line"></div>
      <button class="pill-btn danger submit" id="logout-btn" type="button">Log out</button>
    </div>
  </div>

  <!-- HOME -->
  <main id="home" class="container">
    <section class="hero">
      <h1>ReptiGuide</h1>
      <p>Welcome to ReptiGuide, for the modern standard of reptile care.</p>
    </section>

    <ul class="species-list" id="species-list"></ul>
  </main>

  <!-- SPECIES PAGE -->
  <main id="species" class="species-page"></main>

<script>
  /*
    To add a new reptile, add one entry here.
    Put the photo in the /images folder next to index.html.
  */
  const SPECIES = [
    { slug: "leopard-gecko",        name: "Leopard Gecko",        image: "images/leopard-gecko.jpg" },
    { slug: "crested-gecko",        name: "Crested Gecko",        image: "images/crested-gecko.jpg" },
    { slug: "western-hognose-snake", name: "Western Hognose Snake", image: "images/western-hognose-snake.jpg" },
    { slug: "smooth-knob-tailed-gecko", name: "Smooth Knob Tailed Gecko", image: "images/smooth-knob-tailed-gecko.jpg"}
  ];

  /* =====================================================================
     EDIT YOUR GUIDE TEXT HERE
     ---------------------------------------------------------------------
     Every reptile has the same 7 sections. Replace the word  Here  with
     your own text. Rules:
       - Keep the text between the backticks ( ` ` ).
       - Leave a blank line between paragraphs.
       - Don't use a backtick inside your text.
     ===================================================================== */

  // The sections shown on every reptile page, in this order.
  const SECTIONS = [
    "Enclosure Size",
    "Habitat Decoration",
    "Lighting",
    "Heating & Humidity",
    "Cohabitation & Behavior",
    "Habitat Control & Monitoring",
    "Treatment"
  ];

  const CONTENT = {

    "leopard-gecko": {
      "Enclosure Size": `When housing an adult leopard gecko (Eublepharis macularius), which typically reaches 7 to 10 inches in length, spacious housing is essential. A 40-gallon (150-liter) low or long tank is the recommended standard, generally measuring around 36″ L × 18″ W × 16″ H (91cm L × 45cm W × 40cm H). While hatchlings and young juveniles under 2 months old often thrive in smaller 10- or 20-gallon setups where finding prey is easier, this is strictly temporary. As your gecko approaches 8 months of age, transitioning them to a full-sized 40-gallon enclosure ensures they have ample room to explore and establish proper thermal gradients.  `,
      "Habitat Decoration": `In the wild, leopard geckos are skittish and live in largely cluttered shrublands & forests. For them to truly feel comfort and safety in their enclosure, there are some basics. A minimum of 4 hides/caves is essential, and more is always better. Ideally, there should be a hide on the warm side, a hide in the middle, and a hide on the cool side. But what about the fourth hide? This is the humid hide. It should also be positioned on the middle, ideally a bit closer to the cool side. This hide must only have 1-2 openings, or else the humidity will spread too much. Inside, use damp moss, not too wet and not too dry. Spray it every 3 days to keep it moist. Ensure you have lots of other decorations, artificial or real plants, wood, or leaves.`,
      "Lighting": `While it's true that some leopard geckos do live in locations with particularly high UVB, they spend most of their day sleeping or hiding. How does the UVB benefit them at all if that's what they do? Well, leopard geckos do a very unique activity called cryptic basking. While they stay tucked away during the day, they like to keep a small part of their body out in the sun, usuall the tip of the tail, a leg, or sometimes the snout. This gives the leopard gecko all the UVB they need while staying tucked away. So, the myth that leopard geckos dont need UVB, is not true. So, for your leopard gecko, you will want to use a T5 HO linear UVB tube. While there are some smaller and cheaper coil UVB bulbs, they provide almost no UVB, and actually cost more, due to having to replace them every 3 months. With the linear UVB, you will want the power to be about 5-7% (or 5.0). Set it on top of the mesh lid of your terrarium.`,
      "Heating & Humidity": `Maintaining heat and humidity is one of the most important aspects of leopard gecko care. For the heating, use a Deep Dome lamp, ideally 5.5 inches, plugged into a dimming thermostat. Inside the dome, have a 75-watt to 100-watt Halogen basking heat bulb. Before you get your gecko, the heat must be maintained. The surface of the basking spot should be 88-92 degrees fahrenheit, and the ambience of the warm side should be 85-90 degrees fahrenheit. The cool side should remain below 75 degrees fahrenheit at all times. For humidity, the standard is 35-50% humidity. You might've heard higher than 40% is dangerous, which is not true as long as your terrarium has enough airflow. In the wild, leopard geckos live in semi-arid shrublands, but also semi-tropical forests, such as the Kamdi Corridor in Nepal.`,
      "Cohabitation & Behavior": `Leopard geckos should always be housed individually. They are naturally solitary, highly territorial animals that do not benefit from social interaction with their own species. Grouping them together often leads to resource guarding, chronic stress, and aggressive fights. Housing two males together is particularly dangerous and will lead to severe violence. Even keeping females together or pairing a male with a female carries high risks of harm, so keeping one gecko per enclosure is strongly advised..  `,
      "Habitat Control & Monitoring": `Proper climate control is vital for a leopard gecko setup, requiring reliable electronics to keep your pet safe. Standard analog gauges are notoriously unreliable and prone to inaccurate readings, so you will want to equip your enclosure with a digital thermometer and digital hygrometer instead. Additionally, a quality dimming thermostat is essential to precisely regulate your heat lamp, while a simple plug-in timer set to a 12-hour cycle will automate both your heating and UVB lighting for a consistent day-and-night routine.`,
      "Treatment": `When you first bring your leopard gecko home, give them a mandatory two-week settling-in period with no handling at all to let them adjust to their new environment. After the first week, you can begin gentle interaction by simply placing your hand inside the enclosure or offering a light touch only if they seem receptive. Always move slowly, handle them gently, and avoid stressful environments, never turning them upside down. Once acclimated, keeping handling sessions to reasonable limits is key: cap adults at no more than 2 hours per day, juveniles at 30 minutes daily, and very young hatchlings to just 10 minutes a day—or ideally left unhandled until they are older.`
    },

    "crested-gecko": {
      "Enclosure Size": `An adult crested gecko (Correlophus ciliatus), growing to about 8-10 inches, will require a decently large terrarium. Typically, you want a 40 gallon (150 liter) tall terrarium. The standard dimensions for these terrariums are 18" L x 18" W x 36" H (45cm L x 45cm x 91cm). Now, if you have a baby crested gecko (0-3 months old), a 10 gallon (37 liter) tall or 20 gallon (75 liter) tall terrarium is generally considered safe and in some cases beneficial to help them find food. However, the minimum for adults remains, and they will need an upgrade if you do start it in any smaller of a tank.`,
      "Habitat Decoration": `Here`,
      "Lighting": `Here`,
      "Heating & Humidity": `Crested geckos generally do not require supplemental heating as long as your room stays consistently between 70°F and 76°F (21°C to 24°C) during the day. Maintaining proper moisture levels is equally essential: aim for an average daytime humidity of 50% to 70% with a dry-out period, followed by a heavy evening misting that peaks humidity at 80% to 90% to trigger drinking behavior and support healthy shedding.`,
      "Cohabitation & Behavior": `Here`,
      "Habitat Control & Monitoring": `Here`,
      "Treatment": `Here`
    },

    "western-hognose-snake": {
      "Enclosure Size": `Here`,
      "Habitat Decoration": `Here`,
      "Lighting": `Here`,
      "Heating & Humidity": `Here`,
      "Cohabitation & Behavior": `Here`,
      "Habitat Control & Monitoring": `Here`,
      "Treatment": `Here`,
    },

    "smooth-knob-tailed-gecko": {
      "Enclosure Size": `Here`,
      "Habitat Decoration": `Here`,
      "Lighting": `Here`,
      "Heating & Humidity": `Here`,
      "Cohabitation & Behavior": `Here`,
      "Habitat Control & Monitoring": `Here`,
      "Treatment": `Here`
    }

  };

  /* ===================== END OF EDITABLE TEXT ===================== */

  const SITE_NAME = "ReptiGuide";
  const speciesEl = document.getElementById("species");
  const list = document.getElementById("species-list");
  const titleEl = document.getElementById("topbar-title");

  // Build the buttons
  SPECIES.forEach(s => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "species-btn";
    a.href = "#/" + s.slug;

    const photo = document.createElement("span");
    photo.className = "photo";
    photo.style.backgroundImage = `url("${s.image}")`;

    const label = document.createElement("span");
    label.textContent = s.name;

    a.append(photo, label);
    li.appendChild(a);
    list.appendChild(li);
  });

  // Build the scrolling sections for one reptile
  function renderSpecies(slug) {
    const container = document.createElement("div");
    container.className = "container";
    const text = CONTENT[slug] || {};

    SECTIONS.forEach(title => {
      const section = document.createElement("section");
      section.className = "guide-section";

      const h2 = document.createElement("h2");
      h2.textContent = title;
      section.appendChild(h2);

      (text[title] || "Coming soon").trim().split(/\n\s*\n/).forEach(para => {
        const p = document.createElement("p");
        p.textContent = para.trim();
        section.appendChild(p);
      });

      container.appendChild(section);
    });

    speciesEl.replaceChildren(container);
  }

  // Simple hash router (works on GitHub Pages with just index.html)
  function route() {
    const slug = location.hash.replace(/^#\/?/, "");
    const species = SPECIES.find(s => s.slug === slug);

    if (species) {
      document.body.className = "on-species";
      renderSpecies(species.slug);
      titleEl.textContent = species.name;
      document.title = species.name + " | " + SITE_NAME;
    } else {
      document.body.className = "on-home";
      titleEl.textContent = SITE_NAME;
      document.title = SITE_NAME;
    }
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", route);
  route();
</script>

<!-- ======================= ACCOUNTS (Firebase) ======================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider,
    sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink,
    signInWithEmailAndPassword, createUserWithEmailAndPassword,
    EmailAuthProvider, linkWithCredential, updatePassword, deleteUser, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, updateDoc, writeBatch, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  /* =====================================================================
     YOUR FIREBASE SETTINGS
     ===================================================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyBtG1vHRnV_zrIEi6KeZjSsbqvIESYOhn0",
    authDomain: "reptiguide.firebaseapp.com",
    projectId: "reptiguide",
    appId: "1:213598651104:web:699e753c5c816273000685"
  };
  /* ===================== END OF FIREBASE SETTINGS ===================== */

  /*
    HOW LOGINS WORK (so nobody's real email is ever stored):
    - Your real email, or Google, is only used once to prove you're a real person.
    - Your ReptiGuide login is a made-up address (like u1a2b3c...@users.reptiguide.app)
      that only exists inside Firebase. The public username list only holds that
      made-up address, never a real email.
  */

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  // A second, throwaway connection used only to verify email links.
  // The temporary account it creates is deleted right after verification.
  const verifyAuth = getAuth(initializeApp(firebaseConfig, "email-verify"));

  const $ = id => document.getElementById(id);
  const USERNAME_RE = /^[A-Za-z0-9_]{3,20}$/;
  const ALIAS_DOMAIN = "users.reptiguide.app";
  const EMAIL_KEY = "reptiguideEmailForSignIn";
  const VERIFIED_KEY = "reptiguideEmailVerified";

  const authArea = $("auth-area");
  const authModal = $("auth-modal"), setupModal = $("setup-modal"), settingsModal = $("settings-modal");
  const authMsg = $("auth-msg"), setupMsg = $("setup-msg"), settingsMsg = $("settings-msg");

  const open = el => el.classList.add("open");
  const close = el => el.classList.remove("open");
  function say(el, text, ok) { el.textContent = text || ""; el.classList.toggle("ok", !!ok); }

  function newAlias() {
    const bytes = new Uint8Array(8);
    crypto.getRandomValues(bytes);
    return "u" + Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("") + "@" + ALIAS_DOMAIN;
  }

  // ---- State ----
  let currentUser = null;
  let profile = null;        // { username, photo? } or null if not created yet
  let authRun = 0;
  let settingUp = false;     // true while the "create username + password" step is saving
  let verifiedSignup = false; // true after an email link was verified, before the account exists
  try { verifiedSignup = sessionStorage.getItem(VERIFIED_KEY) === "1"; } catch (_) {}
  function setVerified(v) {
    verifiedSignup = v;
    try { v ? sessionStorage.setItem(VERIFIED_KEY, "1") : sessionStorage.removeItem(VERIFIED_KEY); } catch (_) {}
  }

  // ---- Friendly error messages ----
  function friendly(err) {
    console.error(err);
    switch (err && err.code) {
      case "auth/invalid-credential":
      case "auth/user-not-found":
      case "auth/wrong-password": return "Incorrect username or password.";
      case "auth/too-many-requests": return "Too many attempts. Please wait a moment and try again.";
      case "auth/unauthorized-domain": return "This website's address isn't authorized in Firebase yet.";
      case "auth/operation-not-allowed": return "This sign-in method isn't turned on in Firebase yet.";
      case "auth/invalid-email": return "That email address doesn't look right.";
      case "auth/popup-blocked": return "Your browser blocked the popup. Allow popups for this site and try again.";
      case "auth/network-request-failed": return "Network error. Check your connection and try again.";
      case "auth/popup-closed-by-user":
      case "auth/cancelled-popup-request": return "";
      default: return "Something went wrong. Please try again.";
    }
  }

  // ---- Avatar + top bar ----
  function makeAvatar(large) {
    const span = document.createElement("span");
    span.className = "avatar" + (large ? " large" : "");
    if (profile && profile.photo) {
      const img = document.createElement("img");
      img.alt = "";
      img.src = profile.photo;
      span.appendChild(img);
    } else {
      span.textContent = ((profile && profile.username) || "?").charAt(0).toUpperCase();
    }
    return span;
  }

  function renderAuthArea() {
    authArea.classList.remove("pending");
    authArea.replaceChildren();

    if (currentUser && profile) {
      const btn = document.createElement("button");
      btn.className = "profile-btn";
      btn.type = "button";
      btn.title = "Settings";
      btn.setAttribute("aria-label", "Open settings");
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = profile.username;
      btn.append(makeAvatar(false), name);
      btn.addEventListener("click", openSettings);
      authArea.appendChild(btn);
    } else if (!currentUser && !verifiedSignup) {
      const btn = document.createElement("button");
      btn.className = "pill-btn primary";
      btn.type = "button";
      btn.textContent = "Sign in";
      btn.addEventListener("click", () => openAuth("login"));
      authArea.appendChild(btn);
    }
  }

  // ---- Log in / Create account popup ----
  let mode = "login";
  function setMode(m) {
    mode = m;
    $("tab-login").classList.toggle("active", m === "login");
    $("tab-signup").classList.toggle("active", m === "signup");
    $("login-form").hidden = m !== "login";
    $("signup-form").hidden = m !== "signup";
    $("auth-heading").textContent = m === "login" ? "Welcome back" : "Join ReptiGuide";
    $("auth-divider").textContent = m === "login" ? "or use your username" : "or use your email";
    say(authMsg, "");
  }
  function openAuth(m) { setMode(m || "login"); open(authModal); }
  function closeAuth() {
    close(authModal);
    $("login-form").reset();
    $("signup-form").reset();
    say(authMsg, "");
  }

  $("close-auth").addEventListener("click", closeAuth);
  $("tab-login").addEventListener("click", () => setMode("login"));
  $("tab-signup").addEventListener("click", () => setMode("signup"));

  $("google-btn").addEventListener("click", async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (err) { say(authMsg, friendly(err)); }
  });

  // Log in with username + password
  $("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const username = $("login-username").value.trim();
    const password = $("login-password").value;
    if (!username || !password) return say(authMsg, "Enter your username and password.");

    $("login-submit").disabled = true;
    say(authMsg, "");
    try {
      const snap = await getDoc(doc(db, "usernames", username.toLowerCase()));
      if (!snap.exists() || !snap.data().alias) throw { code: "auth/invalid-credential" };
      await signInWithEmailAndPassword(auth, snap.data().alias, password);
    } catch (err) {
      say(authMsg, friendly(err));
    } finally {
      $("login-submit").disabled = false;
    }
  });

  // Create account step 1: send a verification link to the email
  $("signup-form").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("signup-email").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) return say(authMsg, "Enter a valid email address.");

    $("signup-submit").disabled = true;
    say(authMsg, "");
    try {
      await sendSignInLinkToEmail(verifyAuth, email, {
        url: location.origin + location.pathname,
        handleCodeInApp: true
      });
      try { localStorage.setItem(EMAIL_KEY, email); } catch (_) {}
      say(authMsg, "Check your inbox for a link to verify your email. If you don't see it, check spam.", true);
    } catch (err) {
      say(authMsg, friendly(err));
    } finally {
      $("signup-submit").disabled = false;
    }
  });

  // Back from the email link: confirm it, then forget the email
  async function finishEmailLink() {
    if (!isSignInWithEmailLink(verifyAuth, location.href)) return;
    let email = null;
    try { email = localStorage.getItem(EMAIL_KEY); } catch (_) {}
    if (!email) email = window.prompt("Please confirm your email address to finish signing up:");
    if (!email) return;
    try {
      const cred = await signInWithEmailLink(verifyAuth, email.trim(), location.href);
      try { await deleteUser(cred.user); } catch (_) { await signOut(verifyAuth); }
      try { localStorage.removeItem(EMAIL_KEY); } catch (_) {}
      setVerified(true);
      history.replaceState(null, "", location.pathname + location.hash);
      if (!auth.currentUser) showSetup("");
    } catch (err) {
      console.error(err);
      history.replaceState(null, "", location.pathname + location.hash);
      openAuth("signup");
      say(authMsg, "That link has expired or was already used. Please request a new one.");
    }
  }

  // ---- Create username + password popup ----
  function showSetup(message) {
    closeAuth();
    $("setup-form").reset();
    $("setup-sub").textContent = "You're verified. Now choose a username and password.";
    say(setupMsg, message);
    renderAuthArea();
    open(setupModal);
  }

  $("setup-form").addEventListener("submit", async e => {
    e.preventDefault();

    const username = $("setup-username").value.trim();
    const pw = $("setup-password").value;
    const pw2 = $("setup-password2").value;
    if (!USERNAME_RE.test(username)) return say(setupMsg, "Username must be 3-20 characters: letters, numbers, or underscores.");
    if (pw.length < 8) return say(setupMsg, "Password must be at least 8 characters.");
    if (pw !== pw2) return say(setupMsg, "Passwords don't match.");

    $("setup-submit").disabled = true;
    settingUp = true;
    say(setupMsg, "");
    try {
      const key = username.toLowerCase();
      const existing = await getDoc(doc(db, "usernames", key));
      if (existing.exists()) return say(setupMsg, "That username is already taken.");

      let user = auth.currentUser;
      let alias;
      if (!user) {
        // Email sign-up: the email was already verified, so the real account is made now.
        if (!verifiedSignup) return say(setupMsg, "Please verify your email first.");
        alias = newAlias();
        user = (await createUserWithEmailAndPassword(auth, alias, pw)).user;
      } else {
        // Google sign-up (or a retry): add the username/password login.
        const pwProvider = user.providerData.find(p => p.providerId === "password");
        if (pwProvider) {
          if (!pwProvider.email.endsWith("@" + ALIAS_DOMAIN)) {
            return say(setupMsg, "This account was made with an older sign-up. Delete it in Firebase (Authentication > Users) and sign up again.");
          }
          alias = pwProvider.email;
          await updatePassword(user, pw);
        } else {
          alias = newAlias();
          await linkWithCredential(user, EmailAuthProvider.credential(alias, pw));
        }
      }

      const batch = writeBatch(db);
      batch.set(doc(db, "usernames", key), { uid: user.uid, alias });
      batch.set(doc(db, "users", user.uid), { username });
      await batch.commit();

      currentUser = user;
      profile = { username };
      setVerified(false);
      renderAuthArea();
      close(setupModal);
    } catch (err) {
      console.error(err);
      if (err.code === "permission-denied") say(setupMsg, "Couldn't save that username. It may have just been taken, so try another.");
      else if (err.code === "auth/requires-recent-login") say(setupMsg, "For security, please cancel, sign in again, and finish setup.");
      else if (err.code === "auth/weak-password") say(setupMsg, "That password is too weak. Try a longer one.");
      else say(setupMsg, friendly(err));
    } finally {
      settingUp = false;
      $("setup-submit").disabled = false;
    }
  });

  $("setup-cancel").addEventListener("click", async () => {
    setVerified(false);
    if (auth.currentUser) await signOut(auth);
    else { close(setupModal); renderAuthArea(); }
  });

  // ---- Settings popup ----
  function renderSettings() {
    $("settings-avatar").replaceChildren(makeAvatar(true));
    $("settings-username").value = profile.username;
    $("remove-photo").hidden = !profile.photo;
  }
  function openSettings() {
    if (!profile) return;
    renderSettings();
    say(settingsMsg, "");
    open(settingsModal);
  }
  $("close-settings").addEventListener("click", () => close(settingsModal));

  // Change username (keeps usernames unique; the hidden login address stays the same)
  $("username-form").addEventListener("submit", async e => {
    e.preventDefault();
    const user = auth.currentUser;
    const newName = $("settings-username").value.trim();
    if (!USERNAME_RE.test(newName)) return say(settingsMsg, "Username must be 3-20 characters: letters, numbers, or underscores.");
    if (newName === profile.username) return say(settingsMsg, "That's already your username.");

    const oldKey = profile.username.toLowerCase();
    const newKey = newName.toLowerCase();
    $("username-save").disabled = true;
    say(settingsMsg, "");
    try {
      await runTransaction(db, async tx => {
        if (newKey !== oldKey) {
          const oldRef = doc(db, "usernames", oldKey);
          const newRef = doc(db, "usernames", newKey);
          const oldSnap = await tx.get(oldRef);
          const newSnap = await tx.get(newRef);
          if (newSnap.exists()) throw new Error("USERNAME_TAKEN");
          if (!oldSnap.exists()) throw new Error("MISSING_OLD");
          tx.set(newRef, { uid: user.uid, alias: oldSnap.data().alias });
          tx.delete(oldRef);
        }
        tx.update(doc(db, "users", user.uid), { username: newName });
      });
      profile.username = newName;
      renderAuthArea();
      renderSettings();
      say(settingsMsg, "Username updated.", true);
    } catch (err) {
      console.error(err);
      say(settingsMsg, err.message === "USERNAME_TAKEN" ? "That username is already taken." : "Couldn't update your username. Please try again.");
    } finally {
      $("username-save").disabled = false;
    }
  });

  // Change profile picture (resized to a small square, saved with your profile)
  function resizeImage(file, size) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, size, size);
        const side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }

  async function savePhoto(value) {
    await updateDoc(doc(db, "users", auth.currentUser.uid), { photo: value });
    profile.photo = value;
    renderAuthArea();
    renderSettings();
  }

  $("change-photo").addEventListener("click", () => $("photo-input").click());
  $("photo-input").addEventListener("change", async () => {
    const input = $("photo-input");
    const file = input.files[0];
    input.value = "";
    if (!file) return;
    if (!file.type.startsWith("image/")) return say(settingsMsg, "Please choose an image file.");
    if (file.size > 10 * 1024 * 1024) return say(settingsMsg, "That image is too large (10 MB max).");
    say(settingsMsg, "");
    try {
      await savePhoto(await resizeImage(file, 256));
      say(settingsMsg, "Profile picture updated.", true);
    } catch (err) {
      console.error(err);
      say(settingsMsg, "Couldn't use that image. Try a different one.");
    }
  });

  $("remove-photo").addEventListener("click", async () => {
    say(settingsMsg, "");
    try { await savePhoto(""); say(settingsMsg, "Profile picture removed.", true); }
    catch (err) { console.error(err); say(settingsMsg, "Couldn't remove your picture. Please try again."); }
  });

  $("logout-btn").addEventListener("click", async () => {
    await signOut(auth);
    close(settingsModal);
  });

  // ---- Close popups with Escape or by clicking outside ----
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    closeAuth();
    close(settingsModal);
  });
  authModal.addEventListener("click", e => { if (e.target === authModal) closeAuth(); });
  settingsModal.addEventListener("click", e => { if (e.target === settingsModal) close(settingsModal); });

  // ---- React to logging in / out ----
  onAuthStateChanged(auth, async user => {
    if (settingUp) { currentUser = user; return; }

    const run = ++authRun;
    currentUser = user;
    profile = null;
    let loadFailed = false;

    if (user) {
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        profile = snap.exists() ? snap.data() : null;
      } catch (err) {
        console.error(err);
        loadFailed = true;
      }
      if (run !== authRun) return;
    }

    renderAuthArea();

    if (!user) {
      close(settingsModal);
      if (verifiedSignup) showSetup("");
      else close(setupModal);
    } else if (profile) {
      close(setupModal);
      closeAuth();
    } else {
      showSetup(loadFailed ? "Couldn't load your profile. Make sure Firestore is set up in Firebase." : "");
    }
  });

  finishEmailLink();
</script>
